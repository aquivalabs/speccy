# Baseline workflow added automatically to satisfy branch protection
# (required status checks). Replace the echo step with a real check as needed.
name: CI
on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  status-check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok"

  plugin-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a plugin version bump when the skills change
        env:
          BASE_REF: ${{ github.base_ref }}
          # Empty on pull_request; all-zeros on a branch's first push.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -o errexit -o nounset -o pipefail
          manifest=".claude-plugin/plugin.json"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="origin/${BASE_REF}"
          else
            base="${BEFORE_SHA}"
            # A force push or a branch's first push leaves no usable predecessor.
            if ! git rev-parse --verify --quiet "${base}^{commit}" > /dev/null; then
              base="HEAD~1"
            fi
          fi

          if ! git rev-parse --verify --quiet "${base}^{commit}" > /dev/null; then
            echo "::error::cannot resolve ${base} to compare against."
            exit 1
          fi

          if ! git diff --name-only "${base}...HEAD" | grep --quiet '^skills/'; then
            echo "No changes under skills/ — version bump not required."
            exit 0
          fi

          base_version="$(git show "${base}:${manifest}" | jq --raw-output '.version')"
          head_version="$(jq --raw-output '.version' "${manifest}")"

          if [ "${base_version}" = "${head_version}" ]; then
            echo "::error file=${manifest}::skills/ changed but version is still ${head_version}. Bump it so the banner and the marketplace report this release."
            exit 1
          fi

          echo "Version bumped: ${base_version} -> ${head_version}"
